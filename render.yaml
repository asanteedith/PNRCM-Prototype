services:
  - type: web
    name: pnrcm-revenue-os
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
    disk:
      name: pnrcm-data
      mountPath: /opt/render/project/src
      sizeGB: 1
